[workspace]
resolver = "2"
members = [
    "crates/hre-core",
    "crates/hre-api",
    "crates/hre-store",
    "crates/hre-ml",
    "crates/hre-behavior",
    "crates/hre-fusion",
    "crates/hre-text",
    "crates/hre-vision",
    "crates/hre-calls",
    "crates/hre-audio",
    "crates/hre-slang",
    "crates/hre-evidence",
    "crates/hre-eval",
    "crates/hre-connectors",
    "crates/hre-cli",
    "crates/hre-dashboard",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "=1.0.98"
axum = { version = "=0.8.4", features = ["json", "multipart", "ws"] }
chrono = { version = "=0.4.41", features = ["serde"] }
hmac = "=0.12.1"
sha2 = "=0.10.9"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
thiserror = "=2.0.12"
tokio = { version = "=1.45.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
toml = "=0.8.23"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["env-filter"] }
utoipa = { version = "=5.4.0", features = ["chrono", "uuid"] }
uuid = { version = "=1.16.0", features = ["v4", "serde"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
tower = { version = "=0.5.2", features = ["util"] }
tower-http = { version = "=0.6.2", features = ["cors"] }
http-body-util = "=0.1.3"
tokio-stream = { version = "=0.1.17", features = ["sync"] }
proptest = "=1.6.0"
criterion = "=0.5.1"
ndarray = "=0.17.2"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "api-17", "load-dynamic", "ndarray"] }
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
