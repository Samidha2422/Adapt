[project]
name = "hre-training"
version = "0.1.0"
description = "Synthetic data generator, dataset provenance inventory, and ONNX export contracts for Harassment Risk Engine"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
hre-inventory = "hre_training.inventory:main"
hre-export = "hre_training.export_onnx:main"
hre-generator-a = "hre_training.generator_a:main"

[project.optional-dependencies]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hre_training"]
